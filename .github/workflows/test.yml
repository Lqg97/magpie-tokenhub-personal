name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check index.mjs
          node --check test/tc3.test.mjs
          node --check test/usage.test.mjs
          node --check test/models.test.mjs
      - name: Run unit tests
        run: npm test
